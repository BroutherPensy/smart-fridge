workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - yandex
    scripts:
      - name: Generate Platforms and Fetch Dependencies
        script: | 
          flutter create . --platforms=android,ios
          flutter pub get
      - name: Build Android App (APK)
        script: | 
          flutter build apk --release --dart-define=YANDEX_API_KEY=$YANDEX_API_KEY --dart-define=YANDEX_FOLDER_ID=b1gu1l2c8thgnac4nusp
      - name: Build iOS App (IPA)
        script: | 
          flutter build ios --release --no-codesign --dart-define=YANDEX_API_KEY=$YANDEX_API_KEY --dart-define=YANDEX_FOLDER_ID=b1gu1l2c8thgnac4nusp
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/ios/iphoneos/*.app
