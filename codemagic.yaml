workflows:
  web-build-workflow:
    name: Web Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Recreate missing web platform
        script: |
          rm -rf web
          flutter create --platforms=web .
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Flutter Web
        script: |
          flutter build web --release
    artifacts:
      - build/web/**
